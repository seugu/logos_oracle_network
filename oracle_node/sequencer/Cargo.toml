[package]
name = "sequencer"
categories.workspace = true
description = "LON sequencer"
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
tokio = { default-features = false, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
], version = "1" }
url.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { workspace = true, features = ["derive", "env", "std"] }
tracing = { workspace = true }
tracing-subscriber = { features = ["env-filter"], version = "0.3.23" }
sha2 = { version = "0.11.0" }
hex = { workspace = true }
bytes = { workspace = true }
# lb deps
lb-common-http-client = { workspace = true }
lb-core = { workspace = true }
lb-key-management-system-service = { workspace = true }
logos-blockchain-zone-sdk = { path = "../logos-blockchain/zone-sdk" }
# pyth fetch
reqwest.workspace = true
reqwest-eventsource = "0.6"
futures.workspace = true
dashmap = "6.2.1"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
# Binance fetch
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# lon rfc
prost = "0.14" # grpc
secp256k1 = { version = "0.29", features = ["rand", "hashes"] } # BIP-340 x-only
# contract dev
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0" }
# spel = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0" }
wallet  = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }

# internal
common =  { path = "../common" }
oracle_register_client = { path = "../../oracle_register_client" }

[build-dependencies]
prost-build = "0.14"
