[package]
name = "oracle_prices-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "oracle_prices"
path = "src/bin/oracle_prices.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", branch = "main" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }
oracle_prices_core = { path = "../../oracle_prices_core" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
ruint = "=1.17.0"

