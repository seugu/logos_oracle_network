[package]
name = "oracle_register-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "oracle_register"
path = "src/bin/oracle_register.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", branch = "main" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", features = ["std", "getrandom"] }
oracle_register_core = { path = "../../oracle_register_core" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
ruint = "=1.17.0"

getrandom_0_2 = { package = "getrandom", version = "0.2.17", features = ["custom"] }
getrandom_0_3 = { package = "getrandom", version = "0.3.4" }
sha2 = "0.10.9"
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }

[patch.crates-io]
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
